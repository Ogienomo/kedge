<!-- {{ .RedirectTo }} is always the app's /auth/confirm?next=… URL (see signup and forgot-password forms). -->
<h2>Confirm your email</h2>
<p>Thanks for signing up. Confirm your email address to finish creating your account.</p>
<p><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email">Confirm my email</a></p>
<p>If you didn't sign up, you can ignore this email.</p>
